name: IJDC manuscript (LaTeX)

# Regenerates paper/ijdc/manuscript.tex from paper/manuscript.md (paper/ijdc/build_tex.py), fails if the committed
# file differs, and compiles the anonymised manuscript and the title page to PDF (artifact "ijdc-pdf"). The submission
# zip (paper/ijdc/make_bundle.py, artifact "ijdc-latex-zip") is then compiled on its own in an empty folder, as the
# journal will compile it.

on:
  push:
    paths:
      - "paper/**"
      - "docs/RESULTS_P2.md"
      - "docs/RESULTS_FINAL.md"
      - ".github/workflows/ijdc.yml"
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pandoc (same version as the local build)
        run: pip install pypandoc_binary==1.17
      - name: fonts embedded in the figure PDFs (MATLAB writes Helvetica unembedded; the journal asks for embedded fonts)
        run: |
          sudo apt-get install -y -qq ghostscript > /dev/null
          for f in paper/figures/ijdc_*.pdf paper/figures/p2_fig1_system.pdf; do
            gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -dPDFSETTINGS=/prepress -dEmbedAllFonts=true \
               -dSubsetFonts=true -dCompatibilityLevel=1.5 -sOutputFile=embedded.pdf \
               -c "<</NeverEmbed [ ]>> setdistillerparams" -f "$f" && mv embedded.pdf "$f"
          done
      - name: manuscript.tex is up to date with manuscript.md (the PDF is compiled from the regenerated file)
        continue-on-error: true
        run: |
          python paper/ijdc/build_tex.py
          git diff --exit-code -- paper/ijdc/manuscript.tex paper/ijdc/references.bib
      - name: compile
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper/ijdc
          root_file: |
            manuscript.tex
            title_page.tex
            cover_letter.tex
          latexmk_use_lualatex: false
      - name: warnings that need a look (undefined references or citations, overfull boxes)
        if: always()
        run: |
          cd paper/ijdc
          grep -E "undefined|Overfull|Citation .* undefined|multiply defined" manuscript.log title_page.log || echo "none"
          if grep -E "Reference .* undefined|Citation .* undefined" manuscript.log; then exit 1; fi
      - name: submission zip (flat, anonymity checked against the title page)
        run: |
          python paper/ijdc/make_bundle.py
          mkdir bundle_test
          cd bundle_test && unzip -q ../paper/ijdc/ijdc_latex.zip && ls -la
      - name: the zip compiles on its own
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: bundle_test
          root_file: manuscript.tex
          latexmk_use_lualatex: false
      - name: no undefined references in the zip build
        run: |
          if grep -E "Reference .* undefined|Citation .* undefined|File .* not found" bundle_test/manuscript.log; then exit 1; fi
          a=$(grep -o "Output written on manuscript.pdf ([0-9]* pages" paper/ijdc/manuscript.log)
          b=$(grep -o "Output written on manuscript.pdf ([0-9]* pages" bundle_test/manuscript.log)
          echo "main build: $a"; echo "zip build:  $b"
          [ -n "$b" ] && [ "$a" = "$b" ]
      - uses: actions/upload-artifact@v4
        with:
          name: ijdc-latex-zip
          path: paper/ijdc/ijdc_latex.zip
      - name: submission folder (figures as PDF, EPS with embedded fonts and 600 dpi TIFF; tables as standalone LaTeX)
        run: |
          sudo apt-get install -y -qq ghostscript > /dev/null
          python paper/ijdc/make_bundle.py --package submission
          cp paper/ijdc/ijdc_latex.zip paper/ijdc/manuscript.pdf paper/ijdc/title_page.pdf \
             paper/ijdc/cover_letter.pdf paper/ijdc/cover_letter.txt paper/ijdc/submission_form.txt submission/
          cd submission/figures
          for f in Fig*.pdf; do
            gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=eps2write -dEmbedAllFonts=true -sOutputFile="${f%.pdf}.eps" "$f"
            gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=tiff24nc -sCompression=lzw -r600 -sOutputFile="${f%.pdf}.tif" "$f"
          done
          ls -la
      - name: the tables compile on their own
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: submission/tables
          root_file: Table*.tex
          latexmk_use_lualatex: false
      - name: tidy the tables folder
        run: |
          cd submission/tables
          if grep -E "Reference .* undefined|Citation .* undefined" Table*.log; then exit 1; fi
          rm -f *.aux *.log *.fls *.fdb_latexmk *.out sn-jnl.cls
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ijdc-submission
          path: submission/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ijdc-pdf
          path: |
            paper/ijdc/manuscript.pdf
            paper/ijdc/title_page.pdf
            paper/ijdc/cover_letter.pdf
            paper/ijdc/manuscript.log
            paper/ijdc/manuscript.blg
