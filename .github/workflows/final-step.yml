name: final run step (reusable)

# One step part of rerun/rerun_steps.m (id or id#k/n) on a GitHub-hosted runner with MATLAB R2022b + Simulink.
# Called by final.yml. Wind segments: artifact "wind" of the same run (job prep). Result files of earlier waves:
# the "results-*" artifacts (rerun_run merges their parts first). The part's results/ and log are uploaded even
# when it fails or hits the time limit; re-running the failed job resumes where it stopped (runners save per
# segment). MATLAB on GitHub-hosted runners: free for public repositories.
# Resume: inputs from_run (earlier run whose results-* are downloaded first) and skip (part ids whose job is skipped).
# CONFIRM3 (confirm3.yml, REGISTER_FINAL sec 6): wind_run = the final.yml run whose "wind" artifact (dev export) is
# used; wind3 = also the "wind3" artifact of this run (the CONFIRM3 export) into wind_conf3/. Full git history is
# checked out (the CONFIRM3 opening condition checks an ancestor commit).
# Memory / disk are sampled every minute (logs/sysmon_<part>.txt); swap is off and MATLAB is the OOM killer's first
# choice, so a run-away process ends the step (its saved segments are uploaded) instead of starving the runner.

on:
  workflow_call:
    inputs:
      id:
        required: true
        type: string
      from_run:
        required: false
        default: ""
        type: string
      skip:
        required: false
        default: ""
        type: string
      wind_run:
        required: false
        default: ""
        type: string
      wind3:
        required: false
        default: false
        type: boolean

jobs:
  run:
    name: ${{ inputs.id }}
    if: ${{ !contains(format(',{0},', inputs.skip), format(',{0},', inputs.id)) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: artifact name
        id: nm
        run: echo "safe=$(echo '${{ inputs.id }}' | tr '#/' '__')" >> "$GITHUB_OUTPUT"

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2022b
          products: Simulink
          cache: true

      - name: wind segments
        if: inputs.wind_run == ''
        uses: actions/download-artifact@v4
        with:
          name: wind
          path: .

      - name: wind segments (dev export of another run)
        if: inputs.wind_run != ''
        uses: actions/download-artifact@v4
        with:
          name: wind
          path: .
          run-id: ${{ inputs.wind_run }}
          github-token: ${{ github.token }}

      - name: CONFIRM3 segments
        if: inputs.wind3
        uses: actions/download-artifact@v4
        with:
          name: wind3
          path: wind_conf3

      - name: results of the earlier run (resume)
        if: inputs.from_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}
          pattern: results-*
          path: results
          merge-multiple: true

      - name: results of earlier waves
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: snapshot of the downloaded results
        run: |
          mkdir -p results
          find results -type f -print0 | xargs -0 -r sha1sum | sort > "$RUNNER_TEMP/before.sha"

      - name: machine; memory and disk sampler
        run: |
          nproc; free -m; df -h / | cat
          sudo swapoff -a || true
          mkdir -p logs
          f="logs/sysmon_${{ steps.nm.outputs.safe }}.txt"
          nohup bash -c 'while true; do
              for p in $(pgrep -x MATLAB); do echo 1000 | sudo tee /proc/$p/oom_score_adj > /dev/null 2>&1; done
              echo "$(date -u +%H:%M:%S) mem_used_MB $(free -m | awk "/Mem:/{print \$3}") avail_MB $(free -m | awk "/Mem:/{print \$7}") disk_avail_MB $(df -m --output=avail / | tail -1)"
              sleep 60; done' > "$f" 2>&1 &

      - name: run ${{ inputs.id }}
        uses: matlab-actions/run-command@v2
        timeout-minutes: 345
        with:
          command: addpath('rerun'); rerun_run('${{ inputs.id }}')

      - name: keep only the files this job wrote
        if: always()
        run: |
          find results -type f -print0 | xargs -0 -r sha1sum | sort > "$RUNNER_TEMP/after.sha"
          comm -13 "$RUNNER_TEMP/before.sha" "$RUNNER_TEMP/after.sha" | awk '{print $2}' | while read -r f; do
            mkdir -p "out/$(dirname "$f")" && cp "$f" "out/$f"; done
          mkdir -p out/results
          echo "files written by this job:"; (cd out && find results -type f | sort)
          echo "memory / disk (first and last samples):"; f="logs/sysmon_${{ steps.nm.outputs.safe }}.txt"
          if [ -f "$f" ]; then head -n 2 "$f"; echo ...; tail -n 3 "$f"; sort -k3 -n "$f" | tail -n 1 | sed 's/^/peak: /'; fi

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ steps.nm.outputs.safe }}
          path: out/results/
          overwrite: true
          if-no-files-found: ignore

      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ steps.nm.outputs.safe }}
          path: logs/
          overwrite: true
          if-no-files-found: ignore
