name: final run (MATLAB, parallel)

# GENERATED by rerun/make_workflow.py from rerun/rerun_steps.m - do not edit by hand.
# The final run of the paper (docs/REGISTER_FINAL.md): wind data rebuilt from NREL M5, then waves A..F of
# rerun_steps on GitHub-hosted runners (MATLAB R2022b + Simulink, Ubuntu 22.04), one job per step part, then a
# report job that merges every part and uploads all result files (artifact "final-results").
# Manual start: GitHub -> Actions -> "final run (MATLAB, parallel)" -> Run workflow, or `gh workflow run final.yml`.

on:
  workflow_dispatch:

jobs:
  prep:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: cache the exported wind segments
        id: wind
        uses: actions/cache@v4
        with:
          path: |
            wind_real_t150_i*.mat
            wind_real_t150_batch.json
            wind_expl_t150_i*.mat
            wind_expl_t150_batch.json
            wind_conf2/
            wind_sn010/
            wind_spk/
          key: wind-${{ hashFiles('rerun/m5_*.txt', 'rerun/subset_*.txt', 'rerun/prep_data.sh', 'python/export_wind_sim.py', 'python/wind/*.py', 'python/alpha_report.py', 'python/train_moe.py', 'w4_frozen_20hz_t150_train2345_s0.*') }}
      - uses: actions/setup-python@v5
        if: steps.wind.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"
      - name: python packages
        if: steps.wind.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import numpy, scipy, torch; print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'torch', torch.__version__)"
      - name: cache M5 raw files
        if: steps.wind.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: m5/dev
          key: m5-dev-${{ hashFiles('rerun/m5_dev_urls.txt') }}
      - name: download M5 and export the wind segments
        if: steps.wind.outputs.cache-hit != 'true'
        run: PY=python bash rerun/prep_data.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wind
          retention-days: 30
          compression-level: 1
          path: |
            wind_real_t150_i*.mat
            wind_real_t150_batch.json
            wind_expl_t150_i*.mat
            wind_expl_t150_batch.json
            wind_conf2/
            wind_sn010/
            wind_spk/

  wave-A:
    needs: prep
    if: always()
    strategy:
      fail-fast: false
      matrix:
        id: ['N0P-circle', 'N0P-hover', 'N0P-T3b', 'N0P-square', 'N0P-T5', 'N0P-circle_L15', 'N0P-circle_L05', 'N0V-circle', 'N0V-T3b', 'N0V-square', 'N0H3']
    uses: ./.github/workflows/final-step.yml
    with:
      id: ${{ matrix.id }}

  wave-B:
    needs: wave-A
    if: always()
    strategy:
      fail-fast: false
      matrix:
        id: ['N0W', 'N0W6', 'N0M-square', 'D2#1/4', 'D2#2/4', 'D2#3/4', 'D2#4/4', 'GUO#1/4', 'GUO#2/4', 'GUO#3/4', 'GUO#4/4', 'TAB-T3b#1/5', 'TAB-T3b#2/5', 'TAB-T3b#3/5', 'TAB-T3b#4/5', 'TAB-T3b#5/5', 'TAB-circle#1/2', 'TAB-circle#2/2', 'TAB-mp025#1/2', 'TAB-mp025#2/2', 'TAB-mp065#1/2', 'TAB-mp065#2/2', 'TAB-L150#1/2', 'TAB-L150#2/2', 'TAB-L050#1/2', 'TAB-L050#2/2', 'TAB-mp025-L050#1/2', 'TAB-mp025-L050#2/2', 'TAB-mp025-L150#1/2', 'TAB-mp025-L150#2/2', 'TAB-mp065-L050#1/2', 'TAB-mp065-L050#2/2', 'TAB-mp065-L150#1/2', 'TAB-mp065-L150#2/2']
    uses: ./.github/workflows/final-step.yml
    with:
      id: ${{ matrix.id }}

  wave-C:
    needs: wave-B
    if: always()
    strategy:
      fail-fast: false
      matrix:
        id: ['six-circle-h3#1/3', 'six-circle-h3#2/3', 'six-circle-h3#3/3', 'H3-circle#1/3', 'H3-circle#2/3', 'H3-circle#3/3', 'static-circle', 'iii-circle', 'static-circle-sn', 'static-circle-spk#1/3', 'static-circle-spk#2/3', 'static-circle-spk#3/3', 'N6#1/4', 'N6#2/4', 'N6#3/4', 'N6#4/4', 'static-hover-sn', 'static-hover-spk#1/3', 'static-hover-spk#2/3', 'static-hover-spk#3/3', 'TAB-square#1/6', 'TAB-square#2/6', 'TAB-square#3/6', 'TAB-square#4/6', 'TAB-square#5/6', 'TAB-square#6/6', 'GUOTRIM#1/2', 'GUOTRIM#2/2', 'N4b-P2-base#1/4', 'N4b-P2-base#2/4', 'N4b-P2-base#3/4', 'N4b-P2-base#4/4', 'N4b-P2-L15#1/4', 'N4b-P2-L15#2/4', 'N4b-P2-L15#3/4', 'N4b-P2-L15#4/4', 'N4b-P2-K10#1/4', 'N4b-P2-K10#2/4', 'N4b-P2-K10#3/4', 'N4b-P2-K10#4/4', 'N5-A-Weak#1/3', 'N5-A-Weak#2/3', 'N5-A-Weak#3/3', 'N5-A-Medium#1/2', 'N5-A-Medium#2/2', 'N5-A-StrongRel', 'N5-H-StrongRel']
    uses: ./.github/workflows/final-step.yml
    with:
      id: ${{ matrix.id }}

  wave-D:
    needs: wave-C
    if: always()
    strategy:
      fail-fast: false
      matrix:
        id: ['H3-hover#1/2', 'H3-hover#2/2', 'F-hover#1/3', 'F-hover#2/3', 'F-hover#3/3', 'static-circle-k', 'N4b-P2-d200#1/3', 'N4b-P2-d200#2/3', 'N4b-P2-d200#3/3', 'N5-B-Weak', 'N5-B-Medium']
    uses: ./.github/workflows/final-step.yml
    with:
      id: ${{ matrix.id }}

  wave-E:
    needs: wave-D
    if: always()
    strategy:
      fail-fast: false
      matrix:
        id: ['static-hover#1/2', 'static-hover#2/2', 'iii-hover#1/3', 'iii-hover#2/3', 'iii-hover#3/3']
    uses: ./.github/workflows/final-step.yml
    with:
      id: ${{ matrix.id }}

  wave-F:
    needs: wave-E
    if: always()
    strategy:
      fail-fast: false
      matrix:
        id: ['static-hover-k#1/2', 'static-hover-k#2/2', 'static-indi-bias']
    uses: ./.github/workflows/final-step.yml
    with:
      id: ${{ matrix.id }}

  report:
    needs: wave-F
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2022b
          products: Simulink
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          path: logs
          merge-multiple: true
      - name: merge the parts
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('rerun'); setup_path; rerun_merge(); rerun_summary()
      - uses: actions/upload-artifact@v4
        with:
          name: final-results
          retention-days: 90
          path: |
            results/
            logs/
